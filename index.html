              <input type="radio" name="import-mode" value="merge" checked /> Merge with current subjects
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="radio" name="import-mode" value="replace" /> Replace all data
            </label>
          </div>
        `,
        `
          <button type="button" class="btn btn-secondary" data-action="close-modal">Close</button>
          <button type="button" class="btn btn-lime" id="run-import-btn">Import JSON</button>
        `
      );

      document.getElementById('download-json-btn').addEventListener('click', () => {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `study-progress-backup-${todayISO(0)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded JSON backup file.');
      });

      document.getElementById('copy-json-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(jsonStr).then(() => showToast('Copied backup JSON to clipboard.'));
      });

      document.getElementById('run-import-btn').addEventListener('click', () => {
        const raw = document.getElementById('import-json-ta').value.trim();
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.subjects)) {
            showToast('Invalid JSON format: missing subjects array.');
            return;
          }
          pushUndoSnapshot('JSON Import');
          const mode = document.querySelector('input[name="import-mode"]:checked').value;
          if (mode === 'replace') {
            state.subjects = parsed.subjects;
            if (parsed.stats) state.stats = parsed.stats;
          } else {
            const existingIds = new Set(state.subjects.map(s => s.id));
            for (const s of parsed.subjects) {
              if (!existingIds.has(s.id)) state.subjects.push(s);
            }
          }
          saveState();
          closeAllModals();
          renderApp();
          showToast('Successfully imported study data!', true);
        } catch (e) {
          showToast('JSON parse error: please verify your backup syntax.');
        }
      });
    }

    // Command Palette (Ctrl/Cmd + K)
    function openCommandPalette() {
      const modal = document.getElementById('cmd-modal');
      const input = document.getElementById('cmd-search-input');
      modal.classList.add('open');
      input.value = '';
      cmdSelectedIndex = 0;
      renderCommandResults('');
      setTimeout(() => input.focus(), 30);
    }

    function renderCommandResults(query) {
      const q = query.trim().toLowerCase();
      const actions = [
        { label: 'Go to Dashboard', meta: 'Navigation', run: () => { state.view = 'dashboard'; renderApp(); } },
        { label: 'Open Revise Later Queue', meta: 'Navigation', run: () => { state.view = 'revise'; renderApp(); } },
        { label: 'Create New Subject', meta: 'Action (S)', run: () => openNewSubjectModal() },
        { label: 'Quick Add Topic', meta: 'Action (N)', run: () => openQuickAddModal() },
        { label: 'Toggle Focus Mode', meta: 'Action (F)', run: () => { state.focusMode = !state.focusMode; renderApp(); } },
        { label: 'Start / Pause Pomodoro Timer', meta: '25m / 5m', run: () => togglePomoTimer() },
        { label: 'Toggle Dark / Light Theme', meta: 'Appearance', run: () => { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; saveState(); renderApp(); } },
        { label: 'Export / Import JSON Backup', meta: 'Data', run: () => openExportImportModal() },
        { label: 'Replay Onboarding Tour', meta: 'Help', run: () => startTour() }
      ];

      for (const subj of state.subjects) {
        actions.push({
          label: `Subject: ${subj.name}`,
          meta: 'Jump to Subject',
          run: () => { state.activeSubjectId = subj.id; state.view = 'subject'; renderApp(); }
        });
        for (const chap of subj.chapters) {
          for (const item of chap.items) {
            actions.push({
              label: `${item.completed ? '✓ ' : ''}${item.title}`,
              meta: `${subj.name} • ${chap.title}`,
              run: () => {
                state.activeSubjectId = subj.id;
                state.view = 'subject';
                chap.collapsed = false;
                renderApp();
              }
            });
          }
        }
      }

      cmdFilteredActions = actions.filter(a => a.label.toLowerCase().includes(q) || a.meta.toLowerCase().includes(q)).slice(0, 14);
      if (cmdSelectedIndex >= cmdFilteredActions.length) cmdSelectedIndex = 0;

      const listEl = document.getElementById('cmd-results-list');
      if (!cmdFilteredActions.length) {
        listEl.innerHTML = `<div class="empty-state" style="padding:24px;">No matching subjects, topics, or commands.</div>`;
        return;
      }

      listEl.innerHTML = cmdFilteredActions.map((act, idx) => `
        <button type="button" class="cmd-item ${idx === cmdSelectedIndex ? 'selected' : ''}" data-cmd-idx="${idx}">
          <span style="font-weight:500;">${highlightMatch(act.label, q)}</span>
          <span class="kbd">${escapeHTML(act.meta)}</span>
        </button>
      `).join('');
    }

    /* ==========================================================================
       SECTION 8: ONBOARDING 3-STEP TOUR
       ========================================================================== */
    const TOUR_STEPS = [
      {
        badge: 'Step 1 of 3 • Bento Analytics',
        title: 'Track Momentum at a Glance',
        desc: 'Your Dashboard combines an overall mastery ring, daily streak counter, 12-week cobalt-to-lime heatmap, and weekly velocity chart.'
      },
      {
        badge: 'Step 2 of 3 • Rapid Entry Syntax',
        title: 'Add Topics at Keyboard Speed',
        desc: 'Inside any chapter, type topics with inline tags like "Lesk Algorithm !hard @tomorrow *" and press Enter for rapid entry.'
      },
      {
        badge: 'Step 3 of 3 • Command Palette & Focus',
        title: 'Press Ctrl+K Anywhere',
        desc: 'Jump to any topic, toggle Focus Mode with the built-in 25/5 Pomodoro timer, or export backups without leaving your keyboard.'
      }
    ];

    function startTour() {
      state.tourStep = 0;
      state.tourCompleted = false;
      renderTour();
    }

    function renderTour() {
      const banner = document.getElementById('tour-banner');
      if (state.tourCompleted) {
        banner.classList.remove('active');
        return;
      }
      const step = TOUR_STEPS[state.tourStep] || TOUR_STEPS[0];
      document.getElementById('tour-step-badge').textContent = step.badge;
      document.getElementById('tour-title').textContent = step.title;
      document.getElementById('tour-desc').textContent = step.desc;
      document.getElementById('tour-prev-btn').style.visibility = state.tourStep === 0 ? 'hidden' : 'visible';
      document.getElementById('tour-next-btn').textContent = state.tourStep === TOUR_STEPS.length - 1 ? 'Finish' : 'Next';
      banner.classList.add('active');
    }

    /* ==========================================================================
       SECTION 9: EVENT DELEGATION, DRAG-AND-DROP & KEYBOARD SHORTCUTS
       ========================================================================== */
    let dragContext = null;

    function initEvents() {
      // Global Click Delegation
      document.addEventListener('click', (e) => {
        const cmdBtn = e.target.closest('[data-cmd-idx]');
        if (cmdBtn) {
          const idx = parseInt(cmdBtn.dataset.cmdIdx, 10);
          const act = cmdFilteredActions[idx];
          closeAllModals();
          if (act) act.run();
          return;
        }

        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;

        switch (action) {
          case 'nav-dashboard':
            e.preventDefault();
            state.view = 'dashboard';
            closeMobileDrawer();
            renderApp();
            break;
          case 'nav-revise':
            state.view = 'revise';
            closeMobileDrawer();
            renderApp();
            break;
          case 'open-subject': {
            const subjId = actionEl.dataset.subjectId;
            if (subjId) {
              state.activeSubjectId = subjId;
              state.view = 'subject';
              closeMobileDrawer();
              renderApp();
            }
            break;
          }
          case 'open-drawer':
            document.getElementById('sidebar').classList.add('drawer-open');
            document.getElementById('sidebar-overlay').classList.add('open');
            break;
          case 'close-drawer':
            closeMobileDrawer();
            break;
          case 'open-cmd':
            openCommandPalette();
            break;
          case 'close-modal':
            closeAllModals();
            break;
          case 'new-subject':
            openNewSubjectModal();
            break;
          case 'quick-add-modal':
            openQuickAddModal();
            break;
          case 'open-settings':
            openSettingsModal();
            break;
          case 'open-shortcuts':
            openShortcutsModal();
            break;
          case 'open-export-import':
            openExportImportModal();
            break;
          case 'toggle-theme':
            state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
            saveState();
            renderApp();
            showToast(`Theme switched to ${state.settings.theme} mode.`);
            break;
          case 'toggle-pomo':
            togglePomoTimer();
            break;
          case 'toggle-focus-mode':
            state.focusMode = !state.focusMode;
            renderApp();
            showToast(state.focusMode ? 'Focus Mode enabled: hiding completed items & chrome.' : 'Focus Mode disabled.');
            break;
          case 'edit-daily-goal':
            openSettingsModal();
            break;
          case 'toggle-item': {
            e.stopPropagation();
            toggleItemCheckbox(actionEl.dataset.subjectId, actionEl.dataset.itemId);
            break;
          }
          case 'cycle-priority': {
            e.stopPropagation();
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            for (const c of subj.chapters) {
              const it = c.items.find(i => i.id === actionEl.dataset.itemId);
              if (it) {
                const order = ['easy', 'medium', 'hard'];
                it.priority = order[(order.indexOf(it.priority || 'medium') + 1) % 3];
                saveState();
                renderApp();
                break;
              }
            }
            break;
          }
          case 'toggle-star': {
            e.stopPropagation();
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            for (const c of subj.chapters) {
              const it = c.items.find(i => i.id === actionEl.dataset.itemId);
              if (it) {
                it.starred = !it.starred;
                saveState();
                renderApp();
                break;
              }
            }
            break;
          }
          case 'toggle-notes': {
            e.stopPropagation();
            const itemId = actionEl.dataset.itemId;
            if (openNotesIds.has(itemId)) openNotesIds.delete(itemId);
            else openNotesIds.add(itemId);
            renderApp();
            break;
          }
          case 'edit-due-date': {
            e.stopPropagation();
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            let targetItem = null;
            for (const c of subj.chapters) {
              const found = c.items.find(i => i.id === actionEl.dataset.itemId);
              if (found) { targetItem = found; break; }
            }
            if (!targetItem) break;
            openGenericModal(
              `Due Date: ${targetItem.title}`,
              `
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" class="btn btn-secondary" data-preset-date="${todayISO(0)}">Today</button>
                  <button type="button" class="btn btn-secondary" data-preset-date="${todayISO(1)}">Tomorrow</button>
                  <button type="button" class="btn btn-secondary" data-preset-date="${todayISO(3)}">+3 Days</button>
                  <button type="button" class="btn btn-ghost" data-preset-date="">Clear Date</button>
                </div>
                <div class="form-group" style="margin-top:8px;">
                  <label class="form-label" for="custom-date-inp">Or pick date</label>
                  <input type="date" id="custom-date-inp" class="form-input" value="${targetItem.dueDate || todayISO(0)}" />
                </div>
              `,
              `
                <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-date-btn">Save Date</button>
              `
            );
            document.querySelectorAll('[data-preset-date]').forEach(btn => {
              btn.addEventListener('click', () => {
                targetItem.dueDate = btn.dataset.presetDate || null;
                saveState();
                closeAllModals();
                renderApp();
              });
            });
            document.getElementById('save-date-btn').addEventListener('click', () => {
              targetItem.dueDate = document.getElementById('custom-date-inp').value || null;
              saveState();
              closeAllModals();
              renderApp();
            });
            break;
          }
          case 'delete-item': {
            e.stopPropagation();
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            pushUndoSnapshot('Delete Topic');
            for (const c of subj.chapters) {
              const idx = c.items.findIndex(i => i.id === actionEl.dataset.itemId);
              if (idx !== -1) {
                const [removed] = c.items.splice(idx, 1);
                saveState();
                renderApp();
                showToast(`Deleted "${removed.title}"`, true);
                break;
              }
            }
            break;
          }
          case 'set-filter':
            state.filter = actionEl.dataset.filter;
            renderApp();
            break;
          case 'toggle-chapter': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            const chap = subj && subj.chapters.find(c => c.id === actionEl.dataset.chapterId);
            if (chap) {
              chap.collapsed = !chap.collapsed;
              saveState();
              renderApp();
            }
            break;
          }
          case 'add-chapter': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            openGenericModal(
              'New Chapter / Unit',
              `
                <div class="form-group">
                  <label class="form-label" for="new-chap-inp">Chapter Title</label>
                  <input type="text" id="new-chap-inp" class="form-input" placeholder="e.g., Unit ${subj.chapters.length + 1}: Advanced Topics" />
                </div>
              `,
              `
                <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-new-chap-btn">Add Chapter</button>
              `
            );
            document.getElementById('save-new-chap-btn').addEventListener('click', () => {
              const title = document.getElementById('new-chap-inp').value.trim();
              if (!title) return;
              subj.chapters.push({ id: uid('chap'), title, collapsed: false, items: [] });
              saveState();
              closeAllModals();
              renderApp();
            });
            break;
          }
          case 'rename-chapter': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            const chap = subj && subj.chapters.find(c => c.id === actionEl.dataset.chapterId);
            if (!chap) break;
            openGenericModal(
              'Rename Chapter',
              `<input type="text" id="ren-chap-inp" class="form-input" value="${escapeHTML(chap.title)}" />`,
              `
                <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-ren-chap-btn">Save</button>
              `
            );
            document.getElementById('save-ren-chap-btn').addEventListener('click', () => {
              const val = document.getElementById('ren-chap-inp').value.trim();
              if (val) chap.title = val;
              saveState();
              closeAllModals();
              renderApp();
            });
            break;
          }
          case 'delete-chapter': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            pushUndoSnapshot('Delete Chapter');
            subj.chapters = subj.chapters.filter(c => c.id !== actionEl.dataset.chapterId);
            saveState();
            renderApp();
            showToast('Chapter deleted.', true);
            break;
          }
          case 'open-bulk-add':
            openBulkAddModal(actionEl.dataset.subjectId);
            break;
          case 'reset-subject': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            pushUndoSnapshot(`Reset ${subj.name}`);
            for (const c of subj.chapters) {
              for (const i of c.items) i.completed = false;
            }
            saveState();
            renderApp();
            showToast(`Reset all progress in ${subj.name}.`, true);
            break;
          }
          case 'delete-subject': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            pushUndoSnapshot(`Delete ${subj.name}`);
            state.subjects = state.subjects.filter(s => s.id !== subj.id);
            state.view = 'dashboard';
            saveState();
            renderApp();
            showToast(`Deleted subject "${subj.name}".`, true);
            break;
          }
          case 'edit-subject-badge': {
            const subj = state.subjects.find(s => s.id === actionEl.dataset.subjectId);
            if (!subj) break;
            openGenericModal(
              'Update Subject Badge',
              `<input type="text" id="badge-inp" class="form-input" maxlength="2" value="${escapeHTML(subj.badge)}" />`,
              `<button type="button" class="btn btn-primary" id="save-badge-btn">Save</button>`
            );
            document.getElementById('save-badge-btn').addEventListener('click', () => {
              const v = document.getElementById('badge-inp').value.trim().toUpperCase();
              if (v) subj.badge = v;
              saveState();
              closeAllModals();
              renderApp();
            });
            break;
          }
          case 'skip-tour':
            state.tourCompleted = true;
            saveState();
            renderTour();
            break;
          case 'prev-tour':
            state.tourStep = Math.max(0, state.tourStep - 1);
            renderTour();
            break;
          case 'next-tour':
            if (state.tourStep < TOUR_STEPS.length - 1) {
              state.tourStep++;
            } else {
              state.tourCompleted = true;
              saveState();
            }
            renderTour();
            break;
        }
      });

      // Double-click to inline edit item title
      document.addEventListener('dblclick', (e) => {
        const titleEl = e.target.closest('[data-action="edit-item-title"]');
        if (!titleEl) return;
        const subj = state.subjects.find(s => s.id === titleEl.dataset.subjectId);
        if (!subj) return;
        let targetItem = null;
        for (const c of subj.chapters) {
          const found = c.items.find(i => i.id === titleEl.dataset.itemId);
          if (found) { targetItem = found; break; }
        }
        if (!targetItem) return;
        titleEl.contentEditable = 'true';
        titleEl.focus();
        const finish = () => {
          titleEl.contentEditable = 'false';
          const next = titleEl.textContent.trim();
          if (next) targetItem.title = next;
          saveState();
          renderApp();
        };
        titleEl.addEventListener('blur', finish, { once: true });
        titleEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); titleEl.blur(); }
        });
      });

      // Save inline notes on input
      document.addEventListener('input', (e) => {
        if (e.target.matches('[data-action="save-notes"]')) {
          const subj = state.subjects.find(s => s.id === e.target.dataset.subjectId);
          if (!subj) return;
          for (const c of subj.chapters) {
            const it = c.items.find(i => i.id === e.target.dataset.itemId);
            if (it) {
              it.notes = e.target.value;
              saveState();
              break;
            }
          }
        }
      });

      // Inline Quick-Add Enter handler (keeps focus for rapid entry)
      document.addEventListener('keydown', (e) => {
        if (e.target.matches('.quick-add-input') && e.key === 'Enter') {
          e.preventDefault();
          const raw = e.target.value.trim();
          if (!raw) return;
          const chapId = e.target.dataset.quickAddChapter;
          const subjId = e.target.dataset.subjectId;
          addQuickItemToSubject(subjId, chapId, raw);
          const restoredInput = document.querySelector(`.quick-add-input[data-quick-add-chapter="${chapId}"]`);
          if (restoredInput) restoredInput.focus();
        }
      });

      // Command Palette input navigation
      const cmdInput = document.getElementById('cmd-search-input');
      cmdInput.addEventListener('input', () => {
        cmdSelectedIndex = 0;
        renderCommandResults(cmdInput.value);
      });
      cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          cmdSelectedIndex = (cmdSelectedIndex + 1) % Math.max(1, cmdFilteredActions.length);
          renderCommandResults(cmdInput.value);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          cmdSelectedIndex = (cmdSelectedIndex - 1 + Math.max(1, cmdFilteredActions.length)) % Math.max(1, cmdFilteredActions.length);
          renderCommandResults(cmdInput.value);
        } else if (e.key === 'Enter' && cmdFilteredActions[cmdSelectedIndex]) {
          e.preventDefault();
          const act = cmdFilteredActions[cmdSelectedIndex];
          closeAllModals();
          act.run();
        }
      });

      // Close modal when clicking backdrop
      document.querySelectorAll('.modal-backdrop').forEach(bd => {
        bd.addEventListener('click', (e) => {
          if (e.target === bd) closeAllModals();
        });
      });

      // Global Keyboard Shortcuts
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openCommandPalette();
          return;
        }
        if (e.key === 'Escape') {
          closeAllModals();
          if (state.focusMode) {
            state.focusMode = false;
            renderApp();
          }
          return;
        }

        const inEditable = e.target.matches('input, textarea, select, [contenteditable="true"]');
        if (inEditable) return;

        // Alt + ArrowUp / ArrowDown Keyboard Reordering
        if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
          const rowEl = document.activeElement && document.activeElement.closest('[data-drag-type="item"]');
          if (rowEl) {
            e.preventDefault();
            const subj = state.subjects.find(s => s.id === rowEl.dataset.subjectId);
            const chap = subj && subj.chapters.find(c => c.id === rowEl.dataset.chapterId);
            if (!chap) return;
            const idx = chap.items.findIndex(i => i.id === rowEl.dataset.itemId);
            const targetIdx = e.key === 'ArrowUp' ? idx - 1 : idx + 1;
            if (idx !== -1 && targetIdx >= 0 && targetIdx < chap.items.length) {
              const [moved] = chap.items.splice(idx, 1);
              chap.items.splice(targetIdx, 0, moved);
              saveState();
              renderApp();
              const reFocused = document.querySelector(`[data-item-id="${moved.id}"]`);
              if (reFocused) reFocused.focus();
            }
          }
          return;
        }

        if (e.key === ' ' && document.activeElement && document.activeElement.matches('.item-row-wrap')) {
          e.preventDefault();
          toggleItemCheckbox(document.activeElement.dataset.subjectId, document.activeElement.dataset.itemId);
          return;
        }

        if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement && document.activeElement.matches('.item-row-wrap')) {
          e.preventDefault();
          const btn = document.activeElement.querySelector('[data-action="delete-item"]');
          if (btn) btn.click();
          return;
        }

        if (e.key.toLowerCase() === 'n') {
          e.preventDefault();
          const firstQuick = document.querySelector('.quick-add-input');
          if (firstQuick) firstQuick.focus();
          else openQuickAddModal();
        } else if (e.key.toLowerCase() === 's') {
          e.preventDefault();
          openNewSubjectModal();
        } else if (e.key === '/') {
          e.preventDefault();
          const sInp = document.getElementById('subject-search-input');
          if (sInp) sInp.focus();
          else openCommandPalette();
        } else if (e.key.toLowerCase() === 'f') {
          e.preventDefault();
          state.focusMode = !state.focusMode;
          renderApp();
        } else if (e.key === '?') {
          e.preventDefault();
          openShortcutsModal();
        }
      });

      // Drag and Drop Reordering for Items, Chapters, and Subjects
      document.addEventListener('dragstart', (e) => {
        const dragEl = e.target.closest('[draggable="true"]');
        if (!dragEl) return;
        dragContext = {
          type: dragEl.dataset.dragType,
          subjectId: dragEl.dataset.subjectId,
          chapterId: dragEl.dataset.chapterId,
          itemId: dragEl.dataset.itemId,
          index: parseInt(dragEl.dataset.index, 10)
        };
        dragEl.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      document.addEventListener('dragover', (e) => {
        if (!dragContext) return;
        const overEl = e.target.closest(`[data-drag-type="${dragContext.type}"]`);
        if (!overEl) return;
        e.preventDefault();
        const rect = overEl.getBoundingClientRect();
        const isAfter = (e.clientY - rect.top) > rect.height / 2;
        overEl.classList.toggle('drag-over-bottom', isAfter);
        overEl.classList.toggle('drag-over-top', !isAfter);
      });

      document.addEventListener('dragleave', (e) => {
        const overEl = e.target.closest('[draggable="true"]');
        if (overEl) {
          overEl.classList.remove('drag-over-top', 'drag-over-bottom');
        }
      });

      document.addEventListener('drop', (e) => {
        if (!dragContext) return;
        const dropEl = e.target.closest(`[data-drag-type="${dragContext.type}"]`);
        document.querySelectorAll('.drag-over-top, .drag-over-bottom, .dragging').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging');
        });
        if (!dropEl) { dragContext = null; return; }
        e.preventDefault();

        const toIndex = parseInt(dropEl.dataset.index, 10);
        if (dragContext.type === 'subject') {
          const fromIdx = dragContext.index;
          if (fromIdx !== toIndex) {
            const [moved] = state.subjects.splice(fromIdx, 1);
            state.subjects.splice(toIndex, 0, moved);
            saveState();
            renderApp();
          }
        } else if (dragContext.type === 'chapter' && dragContext.subjectId === dropEl.dataset.subjectId) {
          const subj = state.subjects.find(s => s.id === dragContext.subjectId);
          if (subj && dragContext.index !== toIndex) {
            const [moved] = subj.chapters.splice(dragContext.index, 1);
            subj.chapters.splice(toIndex, 0, moved);
            saveState();
            renderApp();
          }
        } else if (dragContext.type === 'item' && dragContext.subjectId === dropEl.dataset.subjectId) {
          const subj = state.subjects.find(s => s.id === dragContext.subjectId);
          const fromChap = subj && subj.chapters.find(c => c.id === dragContext.chapterId);
          const toChap = subj && subj.chapters.find(c => c.id === dropEl.dataset.chapterId);
          if (fromChap && toChap) {
            const [moved] = fromChap.items.splice(dragContext.index, 1);
            if (moved) {
              toChap.items.splice(toIndex, 0, moved);
              saveState();
              renderApp();
            }
          }
        }
        dragContext = null;
      });

      document.addEventListener('dragend', () => {
        document.querySelectorAll('.drag-over-top, .drag-over-bottom, .dragging').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging');
        });
        dragContext = null;
      });
    }

    function closeMobileDrawer() {
      document.getElementById('sidebar').classList.remove('drawer-open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    /* ==========================================================================
       SECTION 10: BOOTSTRAP
       ========================================================================== */
    function init() {
      loadState();
      initEvents();
      renderApp();

      // Brief skeleton shimmer transition into full interactive dashboard
      setTimeout(() => {
        isBooting = false;
        renderApp();
        renderTour();
      }, 240);
    }

    init();
  </script>
</body>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Study Progress Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & PALETTE (STRICT 3-COLOR DERIVATION)
       ========================================================================== */
    :root {
      /* Core Palette */
      --midnight: #030407;
      --cobalt: #1558C9;
      --lime: #D4FF24;

      /* Derived Dark Surfaces */
      --bg-page: #030407;
      --surface-1: #0A0D14;
      --surface-2: #0F131C;
      --surface-3: #151A26;
      --surface-glass: rgba(10, 13, 20, 0.78);
      --surface-glass-heavy: rgba(10, 13, 20, 0.92);

      /* Derived Cobalt Tints & Borders */
      --border-subtle: rgba(21, 88, 201, 0.18);
      --border-default: rgba(21, 88, 201, 0.28);
      --border-strong: rgba(21, 88, 201, 0.55);
      --cobalt-soft: rgba(21, 88, 201, 0.14);
      --cobalt-medium: rgba(21, 88, 201, 0.26);
      --cobalt-glow: rgba(21, 88, 201, 0.38);
      --card-top-highlight: inset 0 1px 0 rgba(242, 245, 250, 0.06);

      /* Derived Lime Tints */
      --lime-soft: rgba(212, 255, 36, 0.12);
      --lime-medium: rgba(212, 255, 36, 0.25);
      --lime-glow: rgba(212, 255, 36, 0.35);
      --text-on-lime: #030407;

      /* Typography Colors */
      --text-primary: #F2F5FA;
      --text-muted: rgba(242, 245, 250, 0.62);
      --text-faint: rgba(242, 245, 250, 0.38);

      /* Heatmap Scale (Midnight -> Cobalt -> Lime) */
      --heat-0: #0F131C;
      --heat-1: rgba(21, 88, 201, 0.32);
      --heat-2: rgba(21, 88, 201, 0.62);
      --heat-3: #1558C9;
      --heat-4: #D4FF24;

      /* Layout & Geometry (8px Spacing System) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --sidebar-width: 272px;
      --topbar-height: 64px;

      --font-heading: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Light Theme Override (Preserving Cobalt & Lime Accents + WCAG AA Contrast) */
    html[data-theme="light"] {
      --bg-page: #F2F5FA;
      --surface-1: #FFFFFF;
      --surface-2: #E7ECF6;
      --surface-3: #DAE3F2;
      --surface-glass: rgba(242, 245, 250, 0.84);
      --surface-glass-heavy: rgba(255, 255, 255, 0.96);

      --border-subtle: rgba(21, 88, 201, 0.16);
      --border-default: rgba(21, 88, 201, 0.28);
      --border-strong: rgba(21, 88, 201, 0.65);
      --cobalt-soft: rgba(21, 88, 201, 0.10);
      --cobalt-medium: rgba(21, 88, 201, 0.20);
      --cobalt-glow: rgba(21, 88, 201, 0.24);
      --card-top-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.8);

      --lime-soft: rgba(3, 4, 7, 0.06);
      --lime-medium: rgba(212, 255, 36, 0.45);
      --text-primary: #030407;
      --text-muted: rgba(3, 4, 7, 0.65);
      --text-faint: rgba(3, 4, 7, 0.45);

      --heat-0: #E2E8F4;
      --heat-1: rgba(21, 88, 201, 0.28);
      --heat-2: rgba(21, 88, 201, 0.56);
      --heat-3: #1558C9;
      --heat-4: #030407;
    }

    /* ==========================================================================
       2. RESET, SCROLLBARS, AMBIENT TEXTURE & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--cobalt);
      color: #F2F5FA;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-page);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(21, 88, 201, 0.45);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--cobalt);
    }

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Ambient Cobalt Glow + Subtle Technical Grid Texture */
    body::before {
      content: "";
      position: fixed;
      top: -180px;
      right: -120px;
      width: 680px;
      height: 680px;
      background: radial-gradient(circle, rgba(21, 88, 201, 0.22) 0%, rgba(21, 88, 201, 0.05) 45%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(21, 88, 201, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(21, 88, 201, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at 50% 20%, black 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 20%, black 30%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    h1, h2, h3, h4, .num-font {
      font-family: var(--font-heading);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    button {
      cursor: pointer;
      user-select: none;
      transition: transform 0.14s var(--ease-out), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* Accessibility Focus Ring */
    :focus-visible {
      outline: 2px solid var(--cobalt);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }

    /* ==========================================================================
       3. APP SHELL & LAYOUT (SIDEBAR + MAIN + MOBILE NAV)
       ========================================================================== */
    .app-shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: 100vh;
    }

    /* Left Sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: linear-gradient(180deg, var(--surface-1) 0%, var(--bg-page) 100%);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: var(--space-4);
      gap: var(--space-4);
      overflow-y: auto;
      z-index: 30;
      transition: opacity 0.25s ease, filter 0.25s ease, transform 0.28s var(--ease-spring);
    }

    body.focus-mode .sidebar {
      opacity: 0.22;
      filter: blur(1px);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-1) var(--space-2);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cobalt) 0%, #0A2E73 100%);
      border: 1px solid rgba(212, 255, 36, 0.45);
      box-shadow: 0 0 18px rgba(21, 88, 201, 0.45);
      display: grid;
      place-items: center;
      color: var(--lime);
      flex-shrink: 0;
    }

    .cmd-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 13px;
      box-shadow: var(--card-top-highlight);
    }
    .cmd-trigger:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      box-shadow: 0 0 16px rgba(21, 88, 201, 0.2);
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .nav-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      padding: 0 var(--space-2);
      margin-bottom: var(--space-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      padding: 9px 10px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 13.5px;
      border: 1px solid transparent;
      text-align: left;
      position: relative;
    }
    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .nav-item.active {
      background: linear-gradient(90deg, var(--cobalt-medium) 0%, rgba(21, 88, 201, 0.05) 100%);
      color: var(--text-primary);
      border-color: var(--border-strong);
      box-shadow: 0 4px 16px rgba(21, 88, 201, 0.18);
    }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--lime);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .nav-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-badge-sm {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--surface-3);
      border: 1px solid var(--border-default);
      display: grid;
      place-items: center;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .nav-item.active .subject-badge-sm {
      background: var(--cobalt);
      color: #F2F5FA;
      border-color: var(--lime);
    }

    .mini-ring-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: var(--font-heading);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .sidebar-actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .icon-btn-labelled {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .icon-btn-labelled:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: var(--surface-3);
    }

    /* Main Content Area */
    .main-area {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-bottom: 88px;
    }

    /* Sticky Glass Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      height: var(--topbar-height);
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      place-items: center;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breadcrumbs .crumb-link {
      cursor: pointer;
      color: var(--text-muted);
    }
    .breadcrumbs .crumb-link:hover {
      color: var(--text-primary);
    }
    .breadcrumbs .crumb-current {
      color: var(--text-primary);
      font-weight: 600;
      font-family: var(--font-heading);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Pomodoro / Focus Widget in Topbar */
    .pomo-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      font-family: var(--font-heading);
      font-size: 12.5px;
      font-weight: 600;
    }
    .pomo-pill.running {
      border-color: var(--lime);
      box-shadow: 0 0 14px rgba(212, 255, 36, 0.22);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(21, 88, 201, 0.22), rgba(212, 255, 36, 0.10));
      border: 1px solid var(--border-strong);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      color: var(--lime);
    }
    html[data-theme="light"] .streak-pill {
      background: var(--midnight);
      color: var(--lime);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 13px;
      border: 1px solid transparent;
      white-space: nowrap;
      min-height: 36px;
    }
    .btn-primary {
      background: var(--cobalt);
      color: #F2F5FA;
      border-color: rgba(242, 245, 250, 0.16);
      box-shadow: 0 4px 16px rgba(21, 88, 201, 0.35);
    }
    .btn-primary:hover {
      background: #1B66E4;
      box-shadow: 0 6px 22px rgba(21, 88, 201, 0.55);
    }

    .btn-lime {
      background: var(--lime);
      color: var(--text-on-lime);
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(212, 255, 36, 0.28);
    }
    .btn-lime:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 24px rgba(212, 255, 36, 0.45);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text-primary);
      border-color: var(--border-default);
      box-shadow: var(--card-top-highlight);
    }
    .btn-secondary:hover {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
    }
    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    /* Content Container & View Transition */
    .view-container {
      padding: var(--space-6);
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      animation: viewFadeIn 0.26s var(--ease-out);
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       4. BENTO GRID DASHBOARD & CARDS
       ========================================================================== */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .card {
      background: linear-gradient(165deg, var(--surface-2) 0%, var(--surface-1) 100%);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      box-shadow: var(--card-top-highlight), 0 10px 30px rgba(3, 4, 7, 0.35);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s var(--ease-out), border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .card-interactive {
      cursor: pointer;
    }
    .card-interactive:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--card-top-highlight), 0 14px 36px rgba(21, 88, 201, 0.22);
    }

    /* Staggered Load Animation */
    .stagger-in {
      animation: cardSlideUp 0.42s var(--ease-spring) backwards;
    }
    .stagger-1 { animation-delay: 0.03s; }
    .stagger-2 { animation-delay: 0.07s; }
    .stagger-3 { animation-delay: 0.11s; }
    .stagger-4 { animation-delay: 0.15s; }
    .stagger-5 { animation-delay: 0.19s; }
    .stagger-6 { animation-delay: 0.23s; }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. Hero Card */
    .bento-hero {
      grid-column: span 6;
      background:
        radial-gradient(circle at 90% 15%, rgba(21, 88, 201, 0.28) 0%, transparent 60%),
        linear-gradient(165deg, var(--surface-2) 0%, var(--surface-1) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      flex: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-heading);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--lime);
      background: var(--midnight);
      border: 1px solid var(--border-strong);
      padding: 4px 10px;
      border-radius: 999px;
      width: fit-content;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.18;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: 13.5px;
      max-width: 38ch;
    }

    .hero-stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }

    .stat-pill {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .stat-pill strong {
      color: var(--text-primary);
      font-family: var(--font-heading);
      font-weight: 700;
      margin-right: 4px;
    }

    .hero-ring-box {
      position: relative;
      width: 148px;
      height: 148px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .hero-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-pct {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: var(--lime);
      line-height: 1;
    }
    html[data-theme="light"] .hero-pct {
      color: var(--cobalt);
    }

    .hero-pct-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* 2. Streak Card */
    .bento-streak {
      grid-column: span 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 3. Completed Today Card */
    .bento-today {
      grid-column: span 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .big-metric {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.05;
      color: var(--text-primary);
    }
    .big-metric .accent-lime {
      color: var(--lime);
    }
    html[data-theme="light"] .big-metric .accent-lime {
      color: var(--cobalt);
    }

    /* 4. 12-Week Activity Heatmap */
    .bento-heatmap {
      grid-column: span 7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .heatmap-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      min-width: 340px;
    }

    .heatmap-col {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 6px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--heat-0);
      border: 1px solid rgba(21, 88, 201, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .heat-cell:hover {
      transform: scale(1.22);
      z-index: 2;
      border-color: var(--lime);
    }
    .heat-cell[data-level="1"] { background: var(--heat-1); }
    .heat-cell[data-level="2"] { background: var(--heat-2); }
    .heat-cell[data-level="3"] { background: var(--heat-3); }
    .heat-cell[data-level="4"] {
      background: var(--heat-4);
      box-shadow: 0 0 10px rgba(212, 255, 36, 0.35);
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-3);
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-scale {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(21, 88, 201, 0.2);
    }

    /* 7. Weekly SVG Bar Chart Card */
    .bento-weekly {
      grid-column: span 5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 5 & 6. Subjects Grid + Up Next Row */
    .bento-subjects-section {
      grid-column: span 8;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .section-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .section-heading {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subjects-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-4);
    }

    .subject-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-5);
    }

    .subject-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .subject-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cobalt-medium), var(--surface-3));
      border: 1px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: var(--lime);
      box-shadow: 0 4px 14px rgba(21, 88, 201, 0.24);
    }
    html[data-theme="light"] .subject-avatar {
      background: var(--midnight);
      color: var(--lime);
    }

    .pending-chip {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      font-size: 11.5px;
      font-family: var(--font-heading);
      color: var(--text-muted);
    }
    .pending-chip.done-all {
      background: var(--lime);
      color: var(--text-on-lime);
      border-color: var(--lime);
      font-weight: 700;
    }

    .subject-card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .subject-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-heading);
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .subject-progress-meta .pct-highlight {
      color: var(--lime);
      font-weight: 700;
    }
    html[data-theme="light"] .subject-progress-meta .pct-highlight {
      color: var(--cobalt);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(21, 88, 201, 0.16);
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cobalt) 0%, var(--lime) 100%);
      border-radius: 999px;
      transition: width 0.55s var(--ease-spring);
      position: relative;
    }

    .progress-fill.shimmer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
      animation: barShimmer 2.4s infinite;
    }

    @keyframes barShimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 6. Up Next Card */
    .bento-upnext {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .upnext-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .upnext-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .upnext-item:hover {
      border-color: var(--border-strong);
      transform: translateX(2px);
    }

    /* ==========================================================================
       5. SUBJECT PAGE, CHAPTERS, ITEM ROWS & INLINE EDITORS
       ========================================================================== */
    .subject-header-card {
      background:
        radial-gradient(circle at 95% 10%, rgba(21, 88, 201, 0.25) 0%, transparent 55%),
        linear-gradient(165deg, var(--surface-2) 0%, var(--surface-1) 100%);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      box-shadow: var(--card-top-highlight);
    }

    .subject-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
    }

    .subject-title-group {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex: 1;
      min-width: 240px;
    }

    .subject-title-editable {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      padding: 2px 8px;
      margin-left: -8px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: text;
    }
    .subject-title-editable:hover {
      border-color: var(--border-default);
      background: var(--surface-3);
    }
    .subject-title-editable:focus {
      outline: none;
      border-color: var(--cobalt);
      background: var(--surface-3);
    }

    .subject-actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subject-hero-progress {
      margin: var(--space-4) 0;
    }

    .subject-hero-progress-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .subject-big-status {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      color: var(--lime);
    }
    html[data-theme="light"] .subject-big-status {
      color: var(--cobalt);
    }

    .stats-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: var(--space-3);
    }

    /* Filter, Search & Sort Control Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    .segmented-control {
      display: inline-flex;
      background: var(--surface-2);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .seg-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .seg-btn:hover {
      color: var(--text-primary);
    }
    .seg-btn.active {
      background: var(--cobalt);
      color: #F2F5FA;
      box-shadow: 0 2px 10px rgba(21, 88, 201, 0.35);
    }

    .filter-search-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
      min-width: 260px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      max-width: 300px;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 7px 12px 7px 34px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-primary);
    }
    .search-input:focus {
      border-color: var(--cobalt);
      outline: none;
      box-shadow: 0 0 0 3px var(--cobalt-soft);
    }

    .select-control {
      padding: 7px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .select-control option {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    /* Chapters / Units */
    .chapters-stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .chapter-card {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .chapter-card.chapter-pulse {
      animation: limePulse 0.9s var(--ease-out);
    }

    @keyframes limePulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 255, 36, 0.65); border-color: var(--lime); }
      70% { box-shadow: 0 0 0 16px rgba(212, 255, 36, 0); border-color: var(--lime); }
      100% { box-shadow: 0 0 0 0 rgba(212, 255, 36, 0); }
    }

    .chapter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: 14px var(--space-4);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-subtle);
      user-select: none;
    }

    .chapter-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .chapter-collapse-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      background: var(--surface-3);
      transition: transform 0.22s var(--ease-spring);
    }
    .chapter-card.collapsed .chapter-collapse-btn {
      transform: rotate(-90deg);
    }

    .chapter-title {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .chapter-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chapter-mini-bar {
      width: 84px;
      height: 6px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }

    .chapter-body {
      padding: var(--space-3) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .chapter-card.collapsed .chapter-body {
      display: none;
    }

    /* Inline Quick-Add Input */
    .quick-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface-2);
      border: 1px dashed var(--border-default);
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .quick-add-row:focus-within {
      border-style: solid;
      border-color: var(--cobalt);
      box-shadow: 0 0 0 3px var(--cobalt-soft);
    }

    .quick-add-input {
      flex: 1;
      padding: 6px 4px;
      font-size: 13.5px;
      color: var(--text-primary);
      min-width: 0;
    }
    .quick-add-input::placeholder {
      color: var(--text-faint);
    }
    .quick-add-input:focus {
      outline: none;
    }

    .syntax-hint {
      font-size: 11px;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* Item Rows */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-row-wrap {
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      transition: border-color 0.16s ease, background-color 0.16s ease, transform 0.16s ease, opacity 0.2s ease;
    }
    .item-row-wrap:hover {
      border-color: var(--border-strong);
    }
    .item-row-wrap:focus-within {
      border-color: var(--cobalt);
      box-shadow: 0 0 0 2px var(--cobalt-soft);
    }
    .item-row-wrap.completed {
      opacity: 0.64;
      background: rgba(15, 19, 28, 0.55);
    }
    html[data-theme="light"] .item-row-wrap.completed {
      background: rgba(226, 232, 244, 0.55);
    }

    /* Drag-and-drop visual states */
    .dragging {
      opacity: 0.4 !important;
      border: 1px dashed var(--lime) !important;
    }
    .drag-over-top {
      box-shadow: 0 -3px 0 0 var(--lime) !important;
    }
    .drag-over-bottom {
      box-shadow: 0 3px 0 0 var(--lime) !important;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      min-height: 48px;
    }

    .drag-handle {
      color: var(--text-faint);
      cursor: grab;
      display: grid;
      place-items: center;
      padding: 4px;
    }
    .drag-handle:hover {
      color: var(--text-primary);
    }

    /* Custom Lime Checkbox with Animated SVG Stroke */
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--border-strong);
      background: var(--surface-1);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.2s var(--ease-spring);
    }
    .custom-checkbox:hover {
      border-color: var(--lime);
      box-shadow: 0 0 10px rgba(212, 255, 36, 0.25);
    }
    .custom-checkbox.checked {
      background: var(--lime);
      border-color: var(--lime);
      animation: checkPop 0.28s var(--ease-spring);
    }
    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-on-lime);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset 0.22s var(--ease-out);
    }
    .custom-checkbox.checked svg {
      stroke-dashoffset: 0;
    }

    @keyframes checkPop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    .item-title {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      min-width: 0;
      word-break: break-word;
    }
    .item-row-wrap.completed .item-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    mark.search-hl {
      background: var(--lime);
      color: var(--text-on-lime);
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 600;
    }

    .item-meta-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* Priority Pills (Strictly derived from Midnight/Cobalt/Lime) */
    .priority-pill {
      padding: 3px 8px;
      border-radius: 999px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .priority-easy {
      background: var(--surface-3);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    .priority-medium {
      background: var(--cobalt-soft);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }
    .priority-hard {
      background: var(--cobalt);
      color: #F2F5FA;
      border: 1px solid var(--lime);
      box-shadow: 0 0 10px rgba(21, 88, 201, 0.35);
    }

    /* Due Date Chips (Cobalt default, Lime-outlined today, Overdue strikethrough warning without red) */
    .due-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 600;
      background: var(--cobalt-soft);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      cursor: pointer;
    }
    .due-chip.due-today {
      border-color: var(--lime);
      background: rgba(212, 255, 36, 0.14);
      color: var(--lime);
    }
    html[data-theme="light"] .due-chip.due-today {
      background: var(--midnight);
      color: var(--lime);
    }
    .due-chip.due-overdue {
      background: repeating-linear-gradient(
        -45deg,
        rgba(21, 88, 201, 0.25),
        rgba(21, 88, 201, 0.25) 6px,
        rgba(212, 255, 36, 0.18) 6px,
        rgba(212, 255, 36, 0.18) 12px
      );
      border: 1px solid var(--lime);
      color: var(--text-primary);
    }
    .due-chip.due-overdue .due-text {
      text-decoration: line-through;
      text-decoration-color: var(--lime);
      text-decoration-thickness: 2px;
    }

    .row-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
    }
    .row-icon-btn:hover {
      background: var(--surface-3);
      color: var(--text-primary);
    }
    .row-icon-btn.starred {
      color: var(--lime);
    }
    html[data-theme="light"] .row-icon-btn.starred {
      color: var(--cobalt);
    }
    .row-icon-btn.has-notes {
      color: var(--cobalt);
      background: var(--cobalt-soft);
    }

    /* Inline Notes Drawer */
    .item-notes-drawer {
      padding: 0 12px 12px 44px;
      display: none;
    }
    .item-row-wrap.notes-open .item-notes-drawer {
      display: block;
      animation: viewFadeIn 0.18s ease;
    }
    .notes-textarea {
      width: 100%;
      min-height: 68px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
      font-size: 13px;
      resize: vertical;
    }
    .notes-textarea:focus {
      outline: none;
      border-color: var(--cobalt);
    }

    .completed-group-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 6px 4px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .completed-group-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    /* ==========================================================================
       6. MODALS, COMMAND PALETTE, TOASTS, ONBOARDING & EMPTY STATES
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 7, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 10vh var(--space-4) var(--space-4);
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
      animation: viewFadeIn 0.18s var(--ease-out);
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      background: var(--surface-glass-heavy);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      box-shadow: 0 24px 64px rgba(3, 4, 7, 0.75), 0 0 32px rgba(21, 88, 201, 0.25);
      overflow: hidden;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border-subtle);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }
    .modal-body {
      padding: var(--space-5);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .modal-footer {
      padding: var(--space-3) var(--space-5);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-1);
    }

    /* Command Palette */
    .cmd-input-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
    }
    .cmd-input {
      flex: 1;
      font-size: 16px;
      color: var(--text-primary);
    }
    .cmd-input:focus {
      outline: none;
    }
    .cmd-results {
      max-height: 360px;
      overflow-y: auto;
      padding: 8px;
    }
    .cmd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      text-align: left;
      color: var(--text-muted);
    }
    .cmd-item:hover, .cmd-item.selected {
      background: var(--cobalt-medium);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Form Controls in Modals */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input, .form-textarea {
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 14px;
    }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--cobalt);
    }

    /* Toast Stack */
    .toast-stack {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 150;
      max-width: 380px;
    }
    .toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      background: var(--surface-glass-heavy);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--lime);
      border-radius: var(--radius-md);
      box-shadow: 0 12px 32px rgba(3, 4, 7, 0.65);
      animation: cardSlideUp 0.25s var(--ease-spring);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: var(--space-7) var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      color: var(--text-muted);
    }

    /* Skeleton Shimmer on Initial Load */
    .skeleton-screen {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-4);
    }
    .skel-box {
      height: 180px;
      border-radius: var(--radius-xl);
      background: linear-gradient(90deg, var(--surface-1) 25%, var(--surface-2) 50%, var(--surface-1) 75%);
      background-size: 200% 100%;
      animation: skelWave 1.2s infinite;
      border: 1px solid var(--border-subtle);
    }
    @keyframes skelWave {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    /* Onboarding Tour Banner */
    .tour-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, calc(100vw - 32px));
      background: var(--surface-glass-heavy);
      backdrop-filter: blur(18px);
      border: 1px solid var(--lime);
      border-radius: var(--radius-xl);
      padding: var(--space-4) var(--space-5);
      box-shadow: 0 20px 50px rgba(3, 4, 7, 0.8), 0 0 28px rgba(212, 255, 36, 0.22);
      z-index: 120;
      display: none;
    }
    .tour-banner.active {
      display: block;
      animation: cardSlideUp 0.3s var(--ease-spring);
    }

    /* Mobile Bottom Navigation */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--surface-glass-heavy);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-default);
      z-index: 40;
      grid-template-columns: repeat(4, 1fr);
    }

    .mob-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      min-height: 44px;
    }
    .mob-nav-btn.active {
      color: var(--lime);
    }
    html[data-theme="light"] .mob-nav-btn.active {
      color: var(--cobalt);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 7, 0.65);
      backdrop-filter: blur(4px);
      z-index: 25;
    }

    /* Responsive Breakpoints (360px to 1920px) */
    @media (max-width: 1120px) {
      .bento-hero { grid-column: span 12; }
      .bento-streak { grid-column: span 6; }
      .bento-today { grid-column: span 6; }
      .bento-heatmap { grid-column: span 12; }
      .bento-weekly { grid-column: span 12; }
      .bento-subjects-section { grid-column: span 12; }
      .bento-upnext { grid-column: span 12; }
    }

    @media (max-width: 768px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-105%);
      }
      .sidebar.drawer-open {
        transform: translateX(0);
      }
      .sidebar-overlay.open {
        display: block;
      }
      .mobile-menu-btn {
        display: grid;
      }
      .mobile-bottom-nav {
        display: grid;
      }
      .topbar {
        padding: 0 var(--space-4);
      }
      .view-container {
        padding: var(--space-4);
      }
      .bento-hero {
        flex-direction: column-reverse;
        text-align: center;
        align-items: center;
      }
      .hero-copy {
        align-items: center;
      }
      .hero-stats-row {
        justify-content: center;
      }
      .bento-streak, .bento-today {
        grid-column: span 6;
      }
      .toast-stack {
        bottom: 76px;
        left: 16px;
        right: 16px;
        max-width: none;
      }
    }

    @media (max-width: 480px) {
      .bento-streak, .bento-today {
        grid-column: span 12;
      }
      .pomo-pill span.pomo-label-text {
        display: none;
      }
      .syntax-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <!-- Mobile Bottom Bar -->

      <div class="cmd-input-bar">

  <!-- ========================================================================
       GENERIC DYNAMIC MODAL (New Subject, Bulk Add, Export/Import, Settings, Celebration)

  <!-- ========================================================================
       ONBOARDING 3-STEP LIGHTWEIGHT TOUR

  <div id="tour-banner" class="tour-banner" role="region" aria-label="Onboarding Tour">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">

    <h4 id="tour-title" style="font-size:17px;margin-bottom:4px;">Welcome to Study Progress Tracker</h4>
    <p id="tour-desc" style="color:var(--text-muted);font-size:13px;margin-bottom:14px;"></p>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button type="button" class="btn btn-secondary" id="tour-prev-btn" data-action="prev-tour">Back</button>
      <button type="button" class="btn btn-lime" id="tour-next-btn" data-action="next-tour">Next</button>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script>
    /* ==========================================================================
       SECTION 1: UTILS & HELPERS
       ========================================================================== */
    const STORAGE_KEY = 'study_progress_tracker_v1';

    function uid(prefix = 'id') {
      return `${prefix}_${Math.random().toString(36).slice(2, 9)}_${Date.now().toString(36)}`;
    }

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function highlightMatch(text, query) {
      const safeText = escapeHTML(text);
      if (!query || !query.trim()) return safeText;
      const escapedQuery = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return safeText.replace(regex, '<mark class="search-hl">$1</mark>');
    }

    function announce(msg) {
      const el = document.getElementById('aria-live');
      if (el) el.textContent = msg;
    }

    // Parse rapid entry syntax: "Topic name !hard #unit2 @tomorrow *"
    function parseQuickInput(rawText) {
      let title = rawText.trim();
      let priority = 'medium';
      let chapterHint = null;
      let dueDate = null;
      let starred = false;

      if (/(^|\s)\*(\s|$)/.test(title)) {
        starred = true;
        title = title.replace(/(^|\s)\*(\s|$)/g, ' ').trim();
      }

      const priMatch = title.match(/(?:^|\s)!(easy|medium|hard)\b/i);
      if (priMatch) {
        priority = priMatch[1].toLowerCase();
        title = title.replace(priMatch[0], ' ').trim();
      }

      const chapMatch = title.match(/(?:^|\s)#([^\s]+)/);
      if (chapMatch) {
        chapterHint = chapMatch[1].replace(/-/g, ' ');
        title = title.replace(chapMatch[0], ' ').trim();
      }

      const dateMatch = title.match(/(?:^|\s)@([^\s]+)/i);
      if (dateMatch) {
        const token = dateMatch[1].toLowerCase();
        if (token === 'today') dueDate = todayISO(0);
        else if (token === 'tomorrow' || token === 'tmrw') dueDate = todayISO(1);
        else if (token === 'overdue' || token === 'yesterday') dueDate = todayISO(-1);
        else if (/^\+(\d+)d$/.test(token)) {
          const days = parseInt(token.match(/^\+(\d+)d$/)[1], 10);
          dueDate = todayISO(days);
        } else if (/^\d{4}-\d{2}-\d{2}$/.test(token)) {
          dueDate = token;
        }
        title = title.replace(dateMatch[0], ' ').trim();
      }

      return {
        title: title || 'Untitled Topic',
        priority,
        chapterHint,
        dueDate,
        starred
      };
    }

    function formatDueStatus(dueDate) {
      if (!dueDate) return null;
      const today = todayISO(0);
      const tomorrow = todayISO(1);
      if (dueDate < today) {
        return { label: `Overdue (${dueDate.slice(5)})`, cls: 'due-overdue', isOverdue: true };
      }
      if (dueDate === today) {
        return { label: 'Due Today', cls: 'due-today', isToday: true };
      }
      if (dueDate === tomorrow) {
        return { label: 'Tomorrow', cls: '', isSoon: true };
      }
      return { label: dueDate.slice(5), cls: '', isSoon: dueDate <= todayISO(4) };
    }

    function loadState() {
      try {

        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.subjects)) {
            state = parsed;
            // Ensure today exists in activityLog
            if (!state.stats) state.stats = { currentStreak: 1, bestStreak: 1, studyMinutesToday: 0, activityLog: {} };
            if (typeof state.stats.activityLog[todayISO(0)] !== 'number') {

            return;

      } catch (err) {
        if (!storageWarningShown) {
          storageWarningShown = true;
          setTimeout(() => showToast('Local storage is unavailable. Changes will persist for this session only.'), 600);
        }
      }
      state = buildSampleData();
      saveStateImmediate();
    }

    function saveState() {
      clearTimeout(saveTimer);

    function saveStateImmediate() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      const restored = JSON.parse(last.snapshot);
      state.subjects = restored.subjects;

      state.activeSubjectId = restored.activeSubjectId;

    /* ==========================================================================

       ========================================================================== */
    function getSubjectStats(subject) {
      let total = 0;
      let done = 0;
      let starred = 0;
      let overdue = 0;
      const today = todayISO(0);

      for (const chap of subject.chapters) {
        for (const item of chap.items) {
          total++;
          if (item.completed) done++;
          if (item.starred) starred++;
          if (!item.completed && item.dueDate && item.dueDate < today) overdue++;
        }
      }
      const pending = total - done;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      return { total, done, pending, starred, overdue, pct };
    }

    function getOverallStats() {
      let total = 0;
      let done = 0;
      let starred = 0;
      for (const s of state.subjects) {
        const st = getSubjectStats(s);
        total += st.total;
        done += st.done;
        starred += st.starred;
      }
      const pending = total - done;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      return { total, done, pending, starred, pct };
    }

      if (pct < 80) return { title: 'Halfway there & surging', sub: 'More than half of your syllabus is conquered. Stay sharp.' };
      if (pct < 100) return { title: 'Almost done', sub: 'Final stretch—clear the remaining high-priority topics.' };
      return { title: 'Complete syllabus mastery', sub: 'Every single topic across your subjects is complete.' };
    }

          <!-- 2. STREAK CARD -->

            <div class="card-header">
              <span class="card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--lime)">
                  <path d="M12 2c1.8 3.6 5 5.6 5 10.2a5 5 0 1 1-10 0c0-2.3 1.1-4.3 2.4-5.8.3 1.6 1.5 2.4 1.5 2.4S10.2 5.2 12 2z"/>

          <!-- 3. COMPLETED TODAY CARD -->
          <section class="card bento-today stagger-in stagger-3" aria-label="Completed Today">

              </button>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div>
                <div class="big-metric"><span class="accent-lime">${todayDone}</span> / ${goal}</div>
                <p style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">
                  ${todayDone >= goal ? 'Daily target crushed!' : `${goal - todayDone} more to hit daily goal`}

              <svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true" style="flex-shrink:0;">

                <circle cx="34" cy="34" r="${goalR}" fill="none" stroke="var(--lime)" stroke-width="6"
                  stroke-dasharray="${goalCirc.toFixed(2)}" stroke-dashoffset="${goalOffset.toFixed(2)}"
                  stroke-linecap="round" transform="rotate(-90 34 34)"/>
                <text x="34" y="38" text-anchor="middle" fill="var(--text-primary)" font-family="var(--font-heading)" font-size="13" font-weight="700">${goalPct}%</text>

          <!-- 4. 12-WEEK ACTIVITY HEATMAP -->
          ${state.settings.showHeatmap ? `
          <section class="card bento-heatmap stagger-in stagger-4" aria-label="12-Week Activity Heatmap">

            <div class="heatmap-legend">
              <span>Cobalt-to-Lime intensity scale</span>
              <div class="legend-scale">
                <span>Less</span>
                <span class="legend-swatch" style="background:var(--heat-0);"></span>
                <span class="legend-swatch" style="background:var(--heat-1);"></span>
                <span class="legend-swatch" style="background:var(--heat-2);"></span>
                <span class="legend-swatch" style="background:var(--heat-3);"></span>
                <span class="legend-swatch" style="background:var(--heat-4);"></span>
                <span>More</span>
              </div>
            </div>
          </section>
          ` : ''}

          <!-- 7. WEEKLY BAR CHART -->
          <section class="card bento-weekly stagger-in stagger-5" style="${!state.settings.showHeatmap ? 'grid-column: span 12;' : ''}" aria-label="Weekly Velocity Chart">

              <span style="font-size:12px;color:var(--lime);font-family:var(--font-heading);font-weight:600;">

              ${svgBars}

                <button type="button" class="btn btn-primary" data-action="new-subject">+ New Subject</button>

            </div>
            ${state.subjects.length > 0 ? `<div class="subjects-cards-grid">${subjectCardsHTML}</div>` : `

    function renderSubjectPage(container) {
      const subj = state.subjects.find(s => s.id === state.activeSubjectId) || state.subjects[0];
      if (!subj) {
        state.view = 'dashboard';
        renderDashboard(container);
        return;
      }
      state.activeSubjectId = subj.id;
      const st = getSubjectStats(subj);

      const chaptersHTML = subj.chapters.map((chap, cIdx) => {
        const chapTotal = chap.items.length;
        const chapDone = chap.items.filter(i => i.completed).length;
        const chapPct = chapTotal === 0 ? 0 : Math.round((chapDone / chapTotal) * 100);

        // Filter & search items
        let filteredItems = chap.items.filter(item => {
          if (state.focusMode && item.completed) return false;
          if (state.filter === 'pending' && item.completed) return false;
          if (state.filter === 'completed' && !item.completed) return false;
          if (state.filter === 'starred' && !item.starred) return false;
          if (state.searchQuery.trim()) {
            const q = state.searchQuery.trim().toLowerCase();
            const matchTitle = item.title.toLowerCase().includes(q);
            const matchNotes = (item.notes || '').toLowerCase().includes(q);
            return matchTitle || matchNotes;
          }
          return true;
        });

        // Sort items
        const priWeight = { hard: 3, medium: 2, easy: 1 };
        if (state.sortBy === 'priority') {
          filteredItems = [...filteredItems].sort((a, b) => (priWeight[b.priority] || 2) - (priWeight[a.priority] || 2));
        } else if (state.sortBy === 'dueDate') {
          filteredItems = [...filteredItems].sort((a, b) => (a.dueDate || '9999-99-99').localeCompare(b.dueDate || '9999-99-99'));
        } else if (state.sortBy === 'alpha') {
          filteredItems = [...filteredItems].sort((a, b) => a.title.localeCompare(b.title));
        }

        const activeItems = state.settings.groupCompleted
          ? filteredItems.filter(i => !i.completed)
          : filteredItems;
        const completedItems = state.settings.groupCompleted
          ? filteredItems.filter(i => i.completed)
          : [];

        const renderItemRow = (item) => {
          const origIdx = chap.items.findIndex(x => x.id === item.id);
          const dueInfo = formatDueStatus(item.dueDate);
          const notesOpen = openNotesIds.has(item.id);
          return `
            <div class="item-row-wrap ${item.completed ? 'completed' : ''} ${notesOpen ? 'notes-open' : ''}"
              tabindex="0"
              draggable="true"
              data-drag-type="item"
              data-subject-id="${subj.id}"
              data-chapter-id="${chap.id}"
              data-item-id="${item.id}"
              data-index="${origIdx}">
              <div class="item-row">
                <span class="drag-handle" title="Drag to reorder or press Alt+Up/Down" aria-hidden="true">

                    <circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/>
                    <circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>
                  </svg>
                </span>
                <button type="button" class="custom-checkbox ${item.completed ? 'checked' : ''}"
                  data-action="toggle-item" data-subject-id="${subj.id}" data-item-id="${item.id}"
                  aria-label="Mark ${escapeHTML(item.title)} as ${item.completed ? 'incomplete' : 'complete'}">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <span class="item-title" data-action="edit-item-title" data-subject-id="${subj.id}" data-item-id="${item.id}" title="Double-click to edit title">
                  ${highlightMatch(item.title, state.searchQuery)}
                </span>
                <div class="item-meta-group">
                  <button type="button" class="priority-pill priority-${item.priority || 'medium'}"
                    data-action="cycle-priority" data-subject-id="${subj.id}" data-item-id="${item.id}"
                    title="Click to cycle priority (Easy / Medium / Hard)">
                    ${escapeHTML(item.priority || 'medium')}
                  </button>
                  <button type="button" class="due-chip ${dueInfo ? dueInfo.cls : ''}"
                    data-action="edit-due-date" data-subject-id="${subj.id}" data-item-id="${item.id}"
                    title="Set or update due date">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                    </svg>
                    <span class="due-text">${dueInfo ? dueInfo.label : 'Date'}</span>
                  </button>
                  <button type="button" class="row-icon-btn ${item.notes && item.notes.trim() ? 'has-notes' : ''}"

                    title="Toggle inline study notes" aria-label="Toggle notes">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                  </button>
                  <button type="button" class="row-icon-btn ${item.starred ? 'starred' : ''}"
                    data-action="toggle-star" data-subject-id="${subj.id}" data-item-id="${item.id}"
                    title="Flag for Revise Later" aria-label="Star item for revision">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="${item.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>

                  <button type="button" class="row-icon-btn"

              <div class="item-notes-drawer">
                <textarea class="notes-textarea"

        return `

              ${completedItems.length > 0 ? `

              ${activeItems.length === 0 && completedItems.length === 0 ? `
                <div class="empty-state" style="padding:20px;">
                  <p style="font-size:13px;">No matching topics in this chapter.</p>
                </div>
              ` : ''}
            </div>
          </section>
        `;
      }).join('');

      container.innerHTML = `
        <!-- Subject Header Card -->
        <section class="subject-header-card">
          <div class="subject-header-top">
            <div class="subject-title-group">
              <button type="button" class="subject-avatar" data-action="edit-subject-badge" data-subject-id="${subj.id}" title="Click to change badge initials">
                ${escapeHTML(subj.badge || subj.name.slice(0, 2).toUpperCase())}
              </button>
              <div>
                <h1 class="subject-title-editable" contenteditable="true" spellcheck="false"
                  id="subject-inline-title" data-subject-id="${subj.id}"

              </div>
            </div>

            <div class="subject-actions-bar">
              <button type="button" class="btn btn-secondary" data-action="add-chapter" data-subject-id="${subj.id}">+ Chapter</button>
              <button type="button" class="btn btn-secondary" data-action="open-bulk-add" data-subject-id="${subj.id}">Bulk Add</button>
              <button type="button" class="btn btn-secondary" data-action="reset-subject" data-subject-id="${subj.id}">Reset</button>

          <div class="subject-hero-progress">

              <span style="font-size:12.5px;color:var(--text-muted);">${st.pending} pending topics</span>
            </div>
            <div class="progress-track" style="height:12px;">
              <div class="progress-fill shimmer" style="width:${st.pct}%;"></div>
            </div>
          </div>

          <div class="stats-chips-row">
            <span class="stat-pill"><strong>${st.total}</strong>Total</span>
            <span class="stat-pill"><strong>${st.done}</strong>Done</span>

    function showToast(message, withUndo = false) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <span style="font-size:13px;font-weight:500;">${escapeHTML(message)}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          ${withUndo ? `<button type="button" class="btn btn-lime" style="padding:4px 10px;min-height:28px;font-size:12px;" data-action="undo-toast">Undo</button>` : ''}
          <button type="button" class="row-icon-btn" style="width:24px;height:24px;" aria-label="Dismiss">✕</button>
        </div>
      `;
      const closeBtn = toast.querySelector('.row-icon-btn');
      closeBtn.addEventListener('click', () => toast.remove());
      const undoBtn = toast.querySelector('[data-action="undo-toast"]');
      if (undoBtn) {
        undoBtn.addEventListener('click', () => {
          triggerUndo();
          toast.remove();
        });
      }
      stack.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 5200);
    }

    function launchConfetti() {
      if (state.settings.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        return;
      }
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const palette = ['#1558C9', '#D4FF24', '#F2F5FA'];
      const particles = Array.from({ length: 110 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 180,
        y: canvas.height * 0.35,
        vx: (Math.random() - 0.5) * 16,
        vy: -Math.random() * 14 - 4,
        size: Math.random() * 7 + 4,
        color: palette[Math.floor(Math.random() * palette.length)],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25
      }));

      const start = performance.now();
      function frame(now) {
        const elapsed = now - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.38; // gravity
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }
        if (elapsed < 2200) {
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(frame);
    }

    function updatePomoUI() {
      const mm = String(Math.floor(pomo.secondsLeft / 60)).padStart(2, '0');
      const ss = String(pomo.secondsLeft % 60).padStart(2, '0');
      const disp = document.getElementById('pomo-time-display');
      const widget = document.getElementById('pomo-widget');
      const ring = document.getElementById('pomo-ring-circle');
      if (disp) disp.textContent = `${mm}:${ss}`;
      if (widget) widget.classList.toggle('running', pomo.running);
      if (ring) {
        const circ = 56.5;
        const pct = pomo.secondsLeft / pomo.totalSeconds;
        ring.setAttribute('stroke-dashoffset', String((circ * (1 - pct)).toFixed(2)));
      }
    }

    function togglePomoTimer() {
      if (pomo.running) {
        clearInterval(pomo.intervalId);
        pomo.running = false;
        showToast('Pomodoro timer paused.');
      } else {
        pomo.running = true;
        showToast(pomo.mode === 'focus' ? '25m Focus session started!' : '5m Break timer started!');
        pomo.intervalId = setInterval(() => {
          pomo.secondsLeft--;
          if (pomo.mode === 'focus' && pomo.secondsLeft % 60 === 0 && pomo.secondsLeft > 0) {
            state.stats.studyMinutesToday = (state.stats.studyMinutesToday || 0) + 1;
            saveState();
          }
          if (pomo.secondsLeft <= 0) {
            clearInterval(pomo.intervalId);
            pomo.running = false;
            if (pomo.mode === 'focus') {
              state.stats.studyMinutesToday = (state.stats.studyMinutesToday || 0) + 1;
              pomo.mode = 'break';
              pomo.totalSeconds = 5 * 60;
              pomo.secondsLeft = 5 * 60;
              showToast('Focus session complete! Switching to 5-minute break.');
            } else {
              pomo.mode = 'focus';
              pomo.totalSeconds = 25 * 60;
              pomo.secondsLeft = 25 * 60;
              showToast('Break finished! Ready for another 25m focus sprint.');
            }
            saveState();
            renderApp();
          }
          updatePomoUI();
        }, 1000);
      }
      updatePomoUI();
    }

    function toggleItemCheckbox(subjectId, itemId) {
      const subj = state.subjects.find(s => s.id === subjectId);
      if (!subj) return;

      let targetChap = null;
      let targetItem = null;
      for (const chap of subj.chapters) {
        const found = chap.items.find(i => i.id === itemId);
        if (found) {
          targetChap = chap;
          targetItem = found;
          break;
        }
      }
      if (!targetItem) return;

      const prevStats = getSubjectStats(subj);
      targetItem.completed = !targetItem.completed;

      // Update today's activity count & streak
      const todayKey = todayISO(0);
      if (targetItem.completed) {
        state.stats.activityLog[todayKey] = (state.stats.activityLog[todayKey] || 0) + 1;
        if (state.stats.activityLog[todayKey] === 1) {
          state.stats.currentStreak = (state.stats.currentStreak || 0) + 1;
          if (state.stats.currentStreak > state.stats.bestStreak) {
            state.stats.bestStreak = state.stats.currentStreak;
          }
        }
      } else {
        state.stats.activityLog[todayKey] = Math.max(0, (state.stats.activityLog[todayKey] || 1) - 1);
      }

      const nextStats = getSubjectStats(subj);
      announce(`${targetItem.title} marked ${targetItem.completed ? 'completed' : 'incomplete'}. ${subj.name} progress is now ${nextStats.pct} percent.`);

      saveState();
      renderApp();

      // Check chapter 100% pulse
      if (targetItem.completed && targetChap.items.every(i => i.completed)) {
        const chapEl = document.getElementById(`chapter-card-${targetChap.id}`);
        if (chapEl) {
          chapEl.classList.add('chapter-pulse');
        }
      }

      // Check Subject Milestones (25 / 50 / 75 / 100%)
      if (targetItem.completed && nextStats.pct > prevStats.pct) {
        if (nextStats.pct === 100 && nextStats.total > 0) {
          launchConfetti();
          openCelebrationModal(subj, nextStats);
        } else if (nextStats.pct >= 75 && prevStats.pct < 75) {
          showToast(`Milestone: 75% of ${subj.name} completed!`);
        } else if (nextStats.pct >= 50 && prevStats.pct < 50) {
          showToast(`Halfway milestone: 50% of ${subj.name} completed!`);
        } else if (nextStats.pct >= 25 && prevStats.pct < 25) {
          showToast(`Great momentum: 25% of ${subj.name} completed!`);
        }
      }
    }

    function addQuickItemToSubject(subjectId, defaultChapterId, rawText) {
      const subj = state.subjects.find(s => s.id === subjectId);
      if (!subj) return;
      const parsed = parseQuickInput(rawText);
      let targetChap = subj.chapters.find(c => c.id === defaultChapterId) || subj.chapters[0];

      if (parsed.chapterHint) {
        const matchChap = subj.chapters.find(c => c.title.toLowerCase().includes(parsed.chapterHint.toLowerCase()));
        if (matchChap) {
          targetChap = matchChap;
        } else {
          targetChap = { id: uid('chap'), title: parsed.chapterHint, collapsed: false, items: [] };
          subj.chapters.push(targetChap);
        }
      }

      if (!targetChap) {
        targetChap = { id: uid('chap'), title: 'Unit 1', collapsed: false, items: [] };
        subj.chapters.push(targetChap);
      }

      targetChap.items.push({
        id: uid('item'),
        title: parsed.title,
        completed: false,
        priority: parsed.priority,
        starred: parsed.starred,
        dueDate: parsed.dueDate,
        notes: ''
      });

      saveState();
      renderApp();
      showToast(`Added "${parsed.title}" to ${subj.name}`);
    }

      );

      const ta = document.getElementById('bulk-textarea');
      const prev = document.getElementById('bulk-preview');
      ta.addEventListener('input', () => {
        const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
        const chaps = lines.filter(l => l.startsWith('#')).length;
        const items = lines.length - chaps;
        prev.innerHTML = `Preview: <strong>${chaps}</strong> new chapter${chaps === 1 ? '' : 's'}, <strong>${items}</strong> topic item${items === 1 ? '' : 's'}`;
      });

      document.getElementById('confirm-bulk-btn').addEventListener('click', () => {
        const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) return;
        let currentChap = subj.chapters[0];
        if (!currentChap) {
          currentChap = { id: uid('chap'), title: 'Unit 1', collapsed: false, items: [] };
          subj.chapters.push(currentChap);
        }
        let addedCount = 0;
        for (const line of lines) {
          if (line.startsWith('#')) {
            const cTitle = line.replace(/^#+\s*/, '').trim() || 'New Chapter';
            currentChap = { id: uid('chap'), title: cTitle, collapsed: false, items: [] };
            subj.chapters.push(currentChap);
          } else {
            const parsed = parseQuickInput(line);
            currentChap.items.push({
              id: uid('item'),
              title: parsed.title,
              completed: false,
              priority: parsed.priority,
              starred: parsed.starred,
              dueDate: parsed.dueDate,
              notes: ''
            });
            addedCount++;
          }
        }
        saveState();
        closeAllModals();
        renderApp();
        showToast(`Bulk added ${addedCount} items to ${subj.name}`);
      });
    }
